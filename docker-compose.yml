services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/secureshare
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENC_KEY: ${ENC_KEY:?set ENC_KEY in .env}
      STORAGE_QUOTA_MB: 200
      MAX_FILE_MB: 50
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "3000:80"

volumes:
  mongo-data:
  uploads:

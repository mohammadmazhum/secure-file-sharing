apiVersion: v1
kind: Namespace
metadata:
  name: secureshare
---
# Example only. In real use create it from the CLI so secrets are not committed:
# kubectl -n secureshare create secret generic secureshare-secrets \
#   --from-literal=JWT_SECRET=$(openssl rand -hex 24) --from-literal=ENC_KEY=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: secureshare-secrets
  namespace: secureshare
type: Opaque
stringData:
  JWT_SECRET: 2b8004f97e51ad3e4896034844ac4a54a641b524b7c5af4d
  ENC_KEY: "c78e9e1db3f2a20864c3cf1950d6b4383c3f16a425ab38f501ba88e3c6aa2877"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secureshare-config
  namespace: secureshare
data:
  PORT: "5000"
  MONGO_URI: mongodb://mongo:27017/secureshare
  STORAGE_QUOTA_MB: "200"
  MAX_FILE_MB: "50"

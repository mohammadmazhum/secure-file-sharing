apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: uploads-pvc, namespace: secureshare }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: server, namespace: secureshare }
spec:
  replicas: 1          # uploads use a ReadWriteOnce volume; use S3/ReadWriteMany storage before scaling out
  strategy: { type: Recreate }
  selector: { matchLabels: { app: server } }
  template:
    metadata: { labels: { app: server } }
    spec:
      containers:
        - name: server
          image: YOUR_DOCKERHUB_USER/secureshare-server:latest   # replaced by Jenkins
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: secureshare-config }
            - secretRef: { name: secureshare-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: uploads, mountPath: /app/uploads }]
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: server, namespace: secureshare }
spec:
  selector: { app: server }
  ports: [{ port: 5000, targetPort: 5000 }]
